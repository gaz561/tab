name: Agent work
on:
  push:
    branches: ['**']
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: agent-work-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  receive:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: github.event_name != 'push' || (github.ref_name != github.event.repository.default_branch && !github.event.deleted)
    uses: red-cup-engineering/continuous-delivery-services-section/.github/workflows/agent-work.yml@38e1e6ac3d5094049dfc769d83f093f6f33b21a8
